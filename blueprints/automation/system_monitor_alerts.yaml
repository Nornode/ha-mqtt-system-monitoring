# Generated by ha-yaml@aurora-smart-home v1.1.0
# https://github.com/tonylofgren/aurora-smart-home

blueprint:
  name: MQTT System Monitor — Host Alerts
  description: >
    Sends Android push notifications when a monitored Linux host exceeds
    configured thresholds for disk usage, memory usage, load average,
    last-seen timeout, or a watched service enters a failed state.

    Designed for devices created by the ha-mqtt-system-monitoring project.
    https://github.com/Nornode/ha-mqtt-system-monitoring

    ## Requirements
    - ha-mqtt-system-monitoring running on the target host
    - Home Assistant companion app installed on your Android phone(s)

    ## Thresholds
    | Alert | Default | Sustained for |
    |-------|---------|--------------|
    | Disk usage | 85 % | 2 min |
    | Memory usage | 90 % | 2 min |
    | Load avg (15 m) | 2.0 | 5 min |
    | Last seen | 5 min | 1 min |
    | Service failed | — | 1 min |
  domain: automation
  source_url: https://github.com/Nornode/ha-mqtt-system-monitoring/blob/main/blueprints/automation/system_monitor_alerts.yaml
  homeassistant:
    min_version: "2024.10.0"

  input:

    # ── Host ──────────────────────────────────────────────────────────────────
    monitored_device:
      name: Monitored Host
      description: >
        The MQTT device registered by the system monitor.
        Find it under Settings → Devices & Services → MQTT.
      selector:
        device:
          integration: mqtt

    # ── Thresholds ────────────────────────────────────────────────────────────
    disk_threshold:
      name: Disk Usage Threshold (%)
      description: Alert when root-mount disk usage stays above this for 2+ minutes.
      default: 85
      selector:
        number:
          min: 50
          max: 99
          step: 1
          unit_of_measurement: "%"
          mode: slider

    memory_threshold:
      name: Memory Usage Threshold (%)
      description: Alert when memory usage stays above this for 2+ minutes.
      default: 90
      selector:
        number:
          min: 50
          max: 99
          step: 1
          unit_of_measurement: "%"
          mode: slider

    load_threshold:
      name: Load Average (15 min) Threshold
      description: >
        Alert when the 15-minute load average stays above this for 5+ minutes.
        A good starting value is the number of CPU cores on the host.
      default: 2.0
      selector:
        number:
          min: 0.1
          max: 128
          step: 0.1
          mode: box

    last_seen_timeout:
      name: Last Seen Timeout (minutes)
      description: Alert when the host has not reported within this window.
      default: 5
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min
          mode: box

    # ── Service monitoring (optional) ─────────────────────────────────────────
    service_state_entity:
      name: Service State Sensor (optional)
      description: >
        A service state sensor to watch for failures, e.g.
        sensor.myhost_svc_nginx_state. Alerts when state is "failed".
        Leave empty to disable service alerting.
      default: []
      selector:
        entity:
          domain: sensor
          multiple: false

    # ── Notification targets ──────────────────────────────────────────────────
    notify_target:
      name: Notification Service
      description: >
        Your Android companion app notification service name, e.g.
        notify.mobile_app_my_phone. Find it under Developer Tools → Services
        and filter by "notify". For multiple phones, configure a notification
        group in configuration.yaml and enter that group service name here.
      default: notify.notify
      selector:
        text:

# ── Automation-level variables ─────────────────────────────────────────────
# Assign !input values here so they are available inside trigger templates.
variables:
  var_device:            !input monitored_device
  var_disk_threshold:    !input disk_threshold
  var_memory_threshold:  !input memory_threshold
  var_load_threshold:    !input load_threshold
  var_last_seen_timeout: !input last_seen_timeout
  var_service_entity:    !input service_state_entity

# ── Triggers ──────────────────────────────────────────────────────────────
triggers:

  - trigger: template
    id: disk_high
    value_template: >
      {% set eid = device_entities(var_device)
                   | select('search', '_disk_usage')
                   | list | first | default('') %}
      {{ eid != '' and states(eid) | float(0) > var_disk_threshold | float }}
    for:
      minutes: 2

  - trigger: template
    id: memory_high
    value_template: >
      {% set eid = device_entities(var_device)
                   | select('search', '_memory_usage')
                   | list | first | default('') %}
      {{ eid != '' and states(eid) | float(0) > var_memory_threshold | float }}
    for:
      minutes: 2

  - trigger: template
    id: load_high
    value_template: >
      {% set eid = device_entities(var_device)
                   | select('search', '_load_15m')
                   | list | first | default('') %}
      {{ eid != '' and states(eid) | float(0) > var_load_threshold | float }}
    for:
      minutes: 5

  - trigger: template
    id: host_offline
    value_template: >
      {% set eid = device_entities(var_device)
                   | select('search', '_last_seen')
                   | list | first | default('') %}
      {% if eid != '' and states(eid) not in ['unavailable', 'unknown', 'none'] %}
        {% set dt = as_datetime(states(eid)) %}
        {{ dt is not none
           and (now() - dt).total_seconds() > var_last_seen_timeout * 60 }}
      {% else %}
        false
      {% endif %}
    for:
      minutes: 1

  - trigger: template
    id: service_failed
    value_template: >
      {% if var_service_entity and var_service_entity != [] %}
        {{ states(var_service_entity) == 'failed' }}
      {% else %}
        false
      {% endif %}
    for:
      minutes: 1

conditions: []

# ── Actions ───────────────────────────────────────────────────────────────
actions:
  - variables:
      host_name: "{{ device_attr(var_device, 'name') | default('unknown host') }}"
      disk_eid: >-
        {{ device_entities(var_device)
           | select('search', '_disk_usage')
           | list | first | default('') }}
      disk_free_eid: >-
        {{ device_entities(var_device)
           | select('search', '_disk_free')
           | list | first | default('') }}
      memory_eid: >-
        {{ device_entities(var_device)
           | select('search', '_memory_usage')
           | list | first | default('') }}
      memory_free_eid: >-
        {{ device_entities(var_device)
           | select('search', '_memory_free')
           | list | first | default('') }}
      load_1m_eid: >-
        {{ device_entities(var_device)
           | select('search', '_load_1m')
           | list | first | default('') }}
      load_5m_eid: >-
        {{ device_entities(var_device)
           | select('search', '_load_5m')
           | list | first | default('') }}
      load_15m_eid: >-
        {{ device_entities(var_device)
           | select('search', '_load_15m')
           | list | first | default('') }}
      last_seen_eid: >-
        {{ device_entities(var_device)
           | select('search', '_last_seen')
           | list | first | default('') }}
      notif_title: >-
        {%- if trigger.id == 'disk_high' -%}💽 Disk Alert — {{ host_name }}
        {%- elif trigger.id == 'memory_high' -%}🧠 Memory Alert — {{ host_name }}
        {%- elif trigger.id == 'load_high' -%}⚡ High Load — {{ host_name }}
        {%- elif trigger.id == 'host_offline' -%}🔴 Host Offline — {{ host_name }}
        {%- elif trigger.id == 'service_failed' -%}🚨 Service Failed — {{ host_name }}
        {%- else -%}⚠️ System Alert — {{ host_name }}
        {%- endif -%}
      notif_message: |-
        {%- set ts = now().strftime('%H:%M UTC  •  %a %d %b %Y') -%}
        {%- if trigger.id == 'disk_high' and disk_eid != '' -%}
        ⏰ {{ ts }}

        💽 Disk: {{ states(disk_eid) | round(1) }}%  (limit: {{ var_disk_threshold }}%)
           Free: {{ states(disk_free_eid) | float(0) | round(1) }} GiB

        RAM: {{ states(memory_eid) | float(0) | round(1) }}% used  •  {{ states(memory_free_eid) | int(0) }} MiB free
        Load: {{ states(load_1m_eid) | default('?') }} / {{ states(load_5m_eid) | default('?') }} / {{ states(load_15m_eid) | default('?') }}  (1m / 5m / 15m)
        {%- elif trigger.id == 'memory_high' and memory_eid != '' -%}
        ⏰ {{ ts }}

        🧠 Memory: {{ states(memory_eid) | round(1) }}%  (limit: {{ var_memory_threshold }}%)
           Free: {{ states(memory_free_eid) | int(0) }} MiB

        Disk: {{ states(disk_eid) | float(0) | round(1) }}% used  •  {{ states(disk_free_eid) | float(0) | round(1) }} GiB free
        Load: {{ states(load_1m_eid) | default('?') }} / {{ states(load_5m_eid) | default('?') }} / {{ states(load_15m_eid) | default('?') }}  (1m / 5m / 15m)
        {%- elif trigger.id == 'load_high' and load_15m_eid != '' -%}
        ⏰ {{ ts }}

        ⚡ Load: {{ states(load_1m_eid) | default('?') }} / {{ states(load_5m_eid) | default('?') }} / {{ states(load_15m_eid) | default('?') }}  (1m / 5m / 15m)
           15m threshold: {{ var_load_threshold }}

        RAM: {{ states(memory_eid) | float(0) | round(1) }}% used  •  {{ states(memory_free_eid) | int(0) }} MiB free
        Disk: {{ states(disk_eid) | float(0) | round(1) }}% used  •  {{ states(disk_free_eid) | float(0) | round(1) }} GiB free
        {%- elif trigger.id == 'host_offline' -%}
        {%- set ls_raw = states(last_seen_eid) if last_seen_eid != '' else '' -%}
        {%- set ns = namespace(offline_dur='unknown', ls_display='unknown') -%}
        {%- if ls_raw not in ['', 'unavailable', 'unknown', 'none'] -%}
        {%- set ls_dt = as_datetime(ls_raw) -%}
        {%- set diff_s = (now() - ls_dt).total_seconds() | int -%}
        {%- set ns.offline_dur = (diff_s // 3600) ~ 'h ' ~ ((diff_s % 3600) // 60) ~ 'm' if diff_s >= 3600 else (diff_s // 60) ~ 'm ' ~ (diff_s % 60) ~ 's' -%}
        {%- set ns.ls_display = ls_dt.strftime('%H:%M UTC  •  %a %d %b %Y') -%}
        {%- endif -%}
        ⏰ {{ ts }}

        🔴 Offline for: {{ ns.offline_dur }}
           Last seen: {{ ns.ls_display }}
        {%- elif trigger.id == 'service_failed' and var_service_entity and var_service_entity != [] -%}
        {%- set svc_parts = var_service_entity.split('_svc_') -%}
        {%- set svc_name = svc_parts[1][:-6] if svc_parts | length > 1 else var_service_entity -%}
        {%- set svc_base = var_service_entity[:-6] -%}
        {%- set uptime_s = states(svc_base ~ '_uptime') | int(0) -%}
        {%- set uptime_str = (uptime_s // 3600) ~ 'h ' ~ ((uptime_s % 3600) // 60) ~ 'm' if uptime_s >= 3600 else (uptime_s // 60) ~ 'm' -%}
        ⏰ {{ ts }}

        🚨 {{ svc_name }}  →  {{ states(var_service_entity) | default('failed') }}
           Restarts: {{ states(svc_base ~ '_restarts') | int(0) }}  •  Last uptime: {{ uptime_str }}
           Errors: {{ states(svc_base ~ '_errors_1m') | int(0) }} in 1m  /  {{ states(svc_base ~ '_errors_5m') | int(0) }} in 5m

        Load: {{ states(load_1m_eid) | default('?') }} / {{ states(load_5m_eid) | default('?') }} / {{ states(load_15m_eid) | default('?') }}  (1m / 5m / 15m)
        RAM: {{ states(memory_eid) | float(0) | round(1) }}% used  •  {{ states(memory_free_eid) | int(0) }} MiB free
        {%- else -%}
        ⏰ {{ ts }}

        ⚠️ Check {{ host_name }} for details.
        {%- endif -%}
      notif_icon: >-
        {%- if trigger.id == 'disk_high' -%}mdi:harddisk-remove
        {%- elif trigger.id == 'memory_high' -%}mdi:memory
        {%- elif trigger.id == 'load_high' -%}mdi:gauge-full
        {%- elif trigger.id == 'host_offline' -%}mdi:server-off
        {%- elif trigger.id == 'service_failed' -%}mdi:cog-off
        {%- else -%}mdi:server-alert
        {%- endif -%}
      notif_color: >-
        {%- if trigger.id in ['host_offline', 'service_failed'] -%}#e74c3c
        {%- else -%}#e67e22
        {%- endif -%}

  - action: !input notify_target
    data:
      title: "{{ notif_title }}"
      message: "{{ notif_message }}"
      data:
        priority: high
        ttl: 0
        notification_icon: "{{ notif_icon }}"
        color: "{{ notif_color }}"
        tag: "mqtt_monitor_{{ host_name | slugify }}_{{ trigger.id }}"
        channel: SystemAlerts
        importance: high

mode: parallel
max: 10
